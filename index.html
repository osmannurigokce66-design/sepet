<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oturum Sürekliliği Örneği</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .gizli { display: none; }
        .aktif { display: block; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>

    <!-- Giriş Yapılmamış Durum (Giriş Ekranı) -->
    <div id="girisEkrani" class="aktif">
        <h2>Lütfen Giriş Yapın</h2>
        <input type="text" id="kullaniciAdi" placeholder="Kullanıcı Adı"><br><br>
        <button onclick="girisYap()">Giriş Yap</button>
    </div>

    <!-- Giriş Yapılmış Durum (Panel / Ana Ekran) -->
    <div id="panelEkrani" class="gizli">
        <h2 id="karsilamaMesaji">Hoş Geldiniz!</h2>
        <button onclick="cikisYap()">Çıkış Yap</button>
    </div>

    <script>
        // Sayfa yüklendiğinde çalışacak kontrol
        window.onload = function() {
            const kayitliKullanici = localStorage.getItem('aktifKullanici');
            
            if (kayitliKullanici) {
                // Eğer daha önceden giriş yapıldıysa doğrudan paneli göster
                paneliGoster(kayitliKullanici);
            }
        };

        // Giriş yapma fonksiyonu
        function girisYap() {
            const ad = document.getElementById('kullaniciAdi').value.trim();
            if (ad !== "") {
                // Bilgiyi tarayıcının kalıcı hafızasına kaydet
                localStorage.setItem('aktifKullanici', ad);
                paneliGoster(ad);
            } else {
                alert("Lütfen bir kullanıcı adı girin!");
            }
        }

        // Arayüzü panel görünümüne geçiren fonksiyon
        function paneliGoster(kullanici) {
            document.getElementById('girisEkrani').classList.remove('aktif');
            document.getElementById('girisEkrani').classList.add('gizli');

            document.getElementById('panelEkrani').classList.remove('gizli');
            document.getElementById('panelEkrani').classList.add('aktif');

            document.getElementById('karsilamaMesaji').innerText = "Hoş Geldiniz, " + kullanici + "!";
        }

        // Çıkış yapma ve hafızayı temizleme fonksiyonu
        function cikisYap() {
            // Kayıtlı oturumu sil
            localStorage.removeItem('aktifKullanici');

            // Ekranları başa döndür
            document.getElementById('panelEkrani').classList.remove('aktif');
            document.getElementById('panelEkrani').classList.add('gizli');

            document.getElementById('girisEkrani').classList.remove('gizli');
            document.getElementById('girisEkrani').classList.add('aktif');
            
            document.getElementById('kullaniciAdi').value = "";
        }
    </script>

</body>
</html>
